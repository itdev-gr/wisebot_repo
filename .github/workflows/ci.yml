name: CI

# wisebot.gr deploys from main automatically, so this is the only thing standing
# between a broken commit and children using the app. Keep it fast and keep it green.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push to the same branch makes the previous run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fails only on errors. `no-explicit-any` and `no-unused-vars` are warnings on
      # purpose — 600 of them would make this gate impossible to keep green, and they
      # would bury the react-hooks errors, which are the ones that map to real bugs.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # No secrets needed: all AI keys live server-side, and the Supabase client falls
      # back to placeholders when VITE_* vars are absent. This proves the bundle builds,
      # not that it can reach production services.
      - name: Build
        run: npm run build
