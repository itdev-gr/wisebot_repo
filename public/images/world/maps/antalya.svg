<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 627" width="1000" height="627" role="img" aria-label="Stylised map of Antalya">
  <title>Antalya — WiseBot World</title>
  <desc>
    Our own artwork, drawn to the bounds declared in data/world/countries/turkey.ts
    (north 36.895, south 36.845, east 30.79, west 30.635) so that place pins can be projected onto it
    rather than positioned by hand. Deliberately schematic: the curve of the bay is drawn
    through a handful of projected points, with the notch of the old harbour and the cliffs
    of the old town. Nothing here is traced from any map.
  </desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe1" />
      <stop offset="1" stop-color="#efe4d0" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d3e0" />
      <stop offset="1" stop-color="#7cb8cd" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#dccfb5" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1000" height="627" fill="url(#ground)" />
  <rect width="1000" height="627" fill="url(#grid)" opacity="0.55" />

  <!-- The bay, from the long pebble beach in the west round the cliffs to the falls in the east. -->
  <path d="M0 614 L19 489 L65 389 L174 288 L303 201 L394 163 L426 144 L435 125 L458 150 L471 213 L548 314 L742 439 L935 539 L1000 564 L1000 627 L0 627 Z" fill="url(#water)" />
  <path d="M0 614 L19 489 L65 389 L174 288 L303 201 L394 163 L426 144 L435 125 L458 150 L471 213 L548 314 L742 439 L935 539 L1000 564" fill="none" stroke="#5c9fb8" stroke-width="3" />

  <!-- The old town on its cliffs, above the harbour notch. -->
  <ellipse cx="452" cy="114" rx="40" ry="34" fill="#e2d7bf" stroke="#c9b48f" stroke-width="2" />

  <g fill="#8a7c62" font-family="Georgia, 'Times New Roman', serif">
    <text x="452" y="72" font-size="16" text-anchor="middle" letter-spacing="2">KALEİÇİ</text>
    <text x="500" y="587" font-size="18" text-anchor="middle" letter-spacing="3" fill="#4f8ea6">ANTALYA KÖRFEZİ</text>
    <text x="40" y="80" font-size="42" letter-spacing="6">ΑΤΤΑΛΕΙΑ</text>
    <text x="40" y="114" font-size="22" letter-spacing="4">ANTALYA</text>
  </g>

  <!-- Compass. North is up: the artwork is north-aligned, like the bounds. -->
  <g transform="translate(930 90)" stroke="#8a7c62" fill="#8a7c62">
    <circle r="26" fill="none" stroke-width="2" />
    <path d="M0 -22 L7 4 L0 -2 L-7 4 Z" />
    <text y="-30" font-size="16" text-anchor="middle" font-family="Georgia, serif" stroke="none">Β</text>
  </g>
</svg>
