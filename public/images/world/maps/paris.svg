<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="Stylised map of central Paris">
  <title>Paris — WiseBot World</title>
  <desc>
    Our own artwork, drawn to the bounds declared in data/world/countries/france.ts
    (north 48.900, south 48.838, east 2.395, west 2.285) so that place pins can be
    projected onto it rather than positioned by hand. The Seine, its island and the two
    hills are placed from those bounds; nothing here is traced from any map.
  </desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe4" />
      <stop offset="1" stop-color="#e9e0cd" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8cfdd" />
      <stop offset="1" stop-color="#79b2c8" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ddd2ba" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1000" height="760" fill="url(#ground)" />
  <rect width="1000" height="760" fill="url(#grid)" opacity="0.55" />

  <!-- The Seine, entering from the south-east and leaving to the west. -->
  <path
    d="M1000 620 C 850 560, 700 470, 560 430 C 430 393, 300 372, 150 300 C 90 270, 40 240, 0 215"
    fill="none"
    stroke="url(#water)"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- The Île de la Cité, the island the city began on. -->
  <ellipse cx="580" cy="437" rx="52" ry="17" fill="#efe7d6" stroke="#b9a888" stroke-width="2" />

  <!-- Montmartre in the north and the hill of Sainte-Geneviève in the south. -->
  <ellipse cx="525" cy="96" rx="95" ry="50" fill="#d3dfb8" stroke="#adbd8d" stroke-width="2" />
  <ellipse cx="560" cy="620" rx="90" ry="45" fill="#d3dfb8" stroke="#adbd8d" stroke-width="2" />

  <!-- The park at la Villette, in the north-east corner. -->
  <ellipse cx="937" cy="55" rx="70" ry="42" fill="#cfe0c0" stroke="#a8bd96" stroke-width="2" />

  <g fill="#84714f" font-family="Georgia, 'Times New Roman', serif">
    <text x="525" y="102" font-size="20" text-anchor="middle" letter-spacing="3">ΜΟΝΜΑΡΤΡΗ</text>
    <text x="580" y="441" font-size="13" text-anchor="middle" letter-spacing="1">ΤΟ ΝΗΣΙ</text>
    <text x="40" y="66" font-size="38" letter-spacing="5">ΠΑΡΙΣΙ</text>
    <text x="40" y="96" font-size="19" letter-spacing="4">PARIS</text>
  </g>

  <text
    x="250"
    y="330"
    font-size="17"
    fill="#2f7189"
    font-family="Georgia, 'Times New Roman', serif"
    letter-spacing="4"
    transform="rotate(-16 250 330)"
  >ΣΗΚΟΥΑΝΑΣ</text>

  <!-- Compass. North is up: the artwork is north-aligned, like the bounds. -->
  <g transform="translate(930 690)" stroke="#84714f" fill="#84714f">
    <circle r="25" fill="none" stroke-width="2" />
    <path d="M0 -21 L7 4 L0 -2 L-7 4 Z" />
    <text y="-29" font-size="15" text-anchor="middle" font-family="Georgia, serif" stroke="none">Β</text>
  </g>
</svg>
