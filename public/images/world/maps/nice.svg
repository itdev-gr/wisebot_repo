<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Stylised map of Nice">
  <title>Nice — WiseBot World</title>
  <desc>
    Our own artwork, drawn to the bounds declared in data/world/countries/france.ts
    (north 43.724, south 43.688, east 7.29, west 7.242) so that place pins can be projected onto it
    rather than positioned by hand. Deliberately schematic: the curve of the Bay of Angels
    is drawn through a handful of projected points, Castle Hill and the hill of Cimiez are
    rough shapes, and the harbour is a notch in the coast. Nothing here is traced from any map.
  </desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe1" />
      <stop offset="1" stop-color="#efe4d0" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d3e0" />
      <stop offset="1" stop-color="#7cb8cd" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#dccfb5" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="url(#ground)" />
  <rect width="1000" height="1000" fill="url(#grid)" opacity="0.55" />

  <!-- The hill of Cimiez, where the Romans built their town. -->
  <ellipse cx="667" cy="111" rx="150" ry="90" fill="#d8e0c3" stroke="#b7c49a" stroke-width="2" />

  <!-- The Bay of Angels. -->
  <path d="M0 944 L292 875 L542 847 L708 819 L792 875 L885 931 L958 847 L1000 778 L1000 1000 L0 1000 Z" fill="url(#water)" />
  <path d="M0 944 L292 875 L542 847 L708 819 L792 875 L885 931 L958 847 L1000 778" fill="none" stroke="#5c9fb8" stroke-width="3" />

  <!-- The harbour, a notch of water cut into the coast east of Castle Hill. -->
  <rect x="866" y="796" width="56" height="150" fill="url(#water)" stroke="#5c9fb8" stroke-width="3" />

  <!-- Castle Hill, between the old town and the harbour. -->
  <ellipse cx="785" cy="778" rx="55" ry="60" fill="#cddcb4" stroke="#a9bd8c" stroke-width="2" />

  <g fill="#8a7c62" font-family="Georgia, 'Times New Roman', serif">
    <text x="667" y="11" font-size="20" text-anchor="middle" letter-spacing="2">CIMIEZ</text>
    <text x="500" y="880" font-size="18" text-anchor="middle" letter-spacing="3" fill="#4f8ea6">BAIE DES ANGES</text>
    <text x="40" y="930" font-size="42" letter-spacing="6">ΝΙΚΑΙΑ</text>
    <text x="40" y="964" font-size="22" letter-spacing="4">NICE</text>
  </g>

  <!-- Compass. North is up: the artwork is north-aligned, like the bounds. -->
  <g transform="translate(930 90)" stroke="#8a7c62" fill="#8a7c62">
    <circle r="26" fill="none" stroke-width="2" />
    <path d="M0 -22 L7 4 L0 -2 L-7 4 Z" />
    <text y="-30" font-size="16" text-anchor="middle" font-family="Georgia, serif" stroke="none">Β</text>
  </g>
</svg>
