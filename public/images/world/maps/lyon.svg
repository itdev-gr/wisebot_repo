<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1160" width="1000" height="1160" role="img" aria-label="Stylised map of Lyon">
  <title>Lyon — WiseBot World</title>
  <desc>
    Our own artwork, drawn to the bounds declared in data/world/countries/france.ts
    (north 45.786, south 45.728, east 4.862, west 4.812) so that place pins can be projected onto it
    rather than positioned by hand. Deliberately schematic: the Saône and the Rhône are
    drawn through a handful of projected points down to their confluence, the Fourvière
    hill and the Tête d'Or park are rough shapes. Nothing here is traced from any map.
  </desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe1" />
      <stop offset="1" stop-color="#efe4d0" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#dccfb5" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1000" height="1160" fill="url(#ground)" />
  <rect width="1000" height="1160" fill="url(#grid)" opacity="0.55" />

  <!-- The Fourvière hill, west of the Saône, where the Romans built Lugdunum. -->
  <ellipse cx="80" cy="460" rx="150" ry="170" fill="#d8e0c3" stroke="#b7c49a" stroke-width="2" />

  <!-- The Tête d'Or park, north-east on the Rhône. -->
  <ellipse cx="844" cy="108" rx="80" ry="70" fill="#bfd6a4" stroke="#a3bd85" stroke-width="2" />

  <!-- The two rivers, meeting at the southern tip of the peninsula. -->
  <path d="M250 -40 L270 120 L330 280 L380 420 L360 540 L260 720 L140 920 L100 1080" fill="none" stroke="#7cb8cd" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M880 -40 L740 140 L600 320 L580 480 L510 680 L360 840 L190 1000 L100 1080" fill="none" stroke="#7cb8cd" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <g fill="#8a7c62" font-family="Georgia, 'Times New Roman', serif">
    <text x="80" y="550" font-size="20" text-anchor="middle" letter-spacing="2">FOURVIÈRE</text>
    <text x="844" y="115" font-size="16" text-anchor="middle" letter-spacing="1">TÊTE D'OR</text>
    <text x="170" y="220" font-size="16" letter-spacing="3" fill="#4f8ea6">SAÔNE</text>
    <text x="540" y="620" font-size="16" letter-spacing="3" fill="#4f8ea6">RHÔNE</text>
    <text x="960" y="1090" font-size="42" letter-spacing="6" text-anchor="end">ΛΥΩΝ</text>
    <text x="960" y="1124" font-size="22" letter-spacing="4" text-anchor="end">LYON</text>
  </g>

  <!-- Compass. North is up: the artwork is north-aligned, like the bounds. -->
  <g transform="translate(930 90)" stroke="#8a7c62" fill="#8a7c62">
    <circle r="26" fill="none" stroke-width="2" />
    <path d="M0 -22 L7 4 L0 -2 L-7 4 Z" />
    <text y="-30" font-size="16" text-anchor="middle" font-family="Georgia, serif" stroke="none">Β</text>
  </g>
</svg>
