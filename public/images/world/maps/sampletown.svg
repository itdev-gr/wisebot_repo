<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Illustrated map of Sampletown">
  <title>Sampletown</title>
  <desc>Development fixture artwork: a river, a bridge, a hill, a garden and a museum, placed to match the fixture's pin coordinates.</desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#16304f"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="700" fill="url(#ground)"/>
  <rect width="1000" height="700" fill="url(#grid)"/>

  <!-- river, running north-east to south-west, with the bridge crossing at 0.55,0.62 -->
  <path d="M980 180 C 800 260, 700 340, 600 420 C 520 484, 400 560, 240 700"
        fill="none" stroke="url(#water)" stroke-width="54" stroke-linecap="round"/>
  <path d="M980 180 C 800 260, 700 340, 600 420 C 520 484, 400 560, 240 700"
        fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="2"/>

  <!-- streets -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M120 300 L 380 330 L 640 250 L 900 300"/>
    <path d="M300 120 L 360 340 L 430 560"/>
    <path d="M700 140 L 730 300 L 690 480"/>
  </g>

  <!-- the hill, pin at 0.22,0.30 -->
  <path d="M110 300 C 160 190, 280 190, 330 300 Z" fill="#1f3b2e" stroke="#34d399" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M175 250 L 220 205 L 265 250 Z" fill="#2b5344" fill-opacity="0.9"/>

  <!-- the garden, pin at 0.72,0.40 -->
  <rect x="640" y="215" width="160" height="130" rx="24" fill="#17331f" stroke="#4ade80" stroke-opacity="0.3" stroke-width="2"/>
  <g fill="#2f6b41">
    <circle cx="680" cy="255" r="17"/><circle cx="722" cy="292" r="21"/>
    <circle cx="762" cy="248" r="15"/><circle cx="748" cy="315" r="13"/>
  </g>

  <!-- the museum, pin at 0.40,0.48 -->
  <g transform="translate(400 336)">
    <rect x="-62" y="-40" width="124" height="72" rx="6" fill="#241f38" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M-72 -40 L 0 -74 L 72 -40 Z" fill="#2e2750" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2"/>
    <g stroke="#a78bfa" stroke-opacity="0.35" stroke-width="4">
      <path d="M-40 -30 L -40 26"/><path d="M-14 -30 L -14 26"/>
      <path d="M14 -30 L 14 26"/><path d="M40 -30 L 40 26"/>
    </g>
  </g>

  <!-- the bridge, pin at 0.55,0.62 -->
  <g transform="translate(550 434) rotate(-38)">
    <rect x="-70" y="-13" width="140" height="26" rx="5" fill="#3a3325" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2"/>
    <g stroke="#f59e0b" stroke-opacity="0.3" stroke-width="3" fill="none">
      <path d="M-56 13 A 14 14 0 0 1 -28 13"/>
      <path d="M-14 13 A 14 14 0 0 1 14 13"/>
      <path d="M28 13 A 14 14 0 0 1 56 13"/>
    </g>
  </g>

  <text x="500" y="666" text-anchor="middle" fill="#ffffff" fill-opacity="0.18"
        font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="8">
    SAMPLETOWN · DEV FIXTURE
  </text>
</svg>
