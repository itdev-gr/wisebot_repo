<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110" width="1000" height="1110" role="img" aria-label="Stylised map of Athens">
  <title>Athens — WiseBot World</title>
  <desc>
    Our own artwork, drawn to the bounds declared in data/world/countries/greece.ts
    (north 37.995, south 37.925, east 23.76, west 23.68) so that place pins can be
    projected onto it rather than positioned by hand. Deliberately schematic: the hills,
    the green of the National Garden and the line of the Faliro shore are placed from
    those bounds, and nothing here is traced from any map.
  </desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe1" />
      <stop offset="1" stop-color="#efe4d0" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d3e0" />
      <stop offset="1" stop-color="#7cb8cd" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#dccfb5" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1000" height="1110" fill="url(#ground)" />
  <rect width="1000" height="1110" fill="url(#grid)" opacity="0.55" />

  <!-- The Saronic Gulf. The shore runs east-north-east across the bottom strip. -->
  <path d="M0 1025 C 250 1040, 600 1062, 1000 1090 L1000 1110 L0 1110 Z" fill="url(#water)" />
  <path d="M0 1025 C 250 1040, 600 1062, 1000 1090" fill="none" stroke="#5c9fb8" stroke-width="3" />

  <!-- Hills. Centres are the projected positions of the real summits. -->
  <g fill="#cddcb4" stroke="#a9bd8c" stroke-width="2">
    <ellipse cx="576" cy="370" rx="70" ry="42" />
    <ellipse cx="792" cy="207" rx="52" ry="52" />
    <ellipse cx="504" cy="447" rx="58" ry="38" />
    <ellipse cx="740" cy="431" rx="44" ry="30" />
  </g>

  <!-- The National Garden, projected from its own coordinate. -->
  <ellipse cx="730" cy="373" rx="46" ry="34" fill="#bfd6a4" stroke="#a3bd85" stroke-width="2" />

  <!-- The park of the Stavros Niarchos Foundation Cultural Center, on the coast. -->
  <ellipse cx="139" cy="877" rx="62" ry="40" fill="#bfd6a4" stroke="#a3bd85" stroke-width="2" />

  <g fill="#8a7c62" font-family="Georgia, 'Times New Roman', serif">
    <text x="576" y="376" font-size="22" text-anchor="middle" letter-spacing="2">ΑΚΡΟΠΟΛΗ</text>
    <text x="792" y="213" font-size="22" text-anchor="middle" letter-spacing="2">ΛΥΚΑΒΗΤΤΟΣ</text>
    <text x="40" y="70" font-size="42" letter-spacing="6">ΑΘΗΝΑ</text>
    <text x="40" y="104" font-size="22" letter-spacing="4">ATHENS</text>
  </g>

  <!-- Compass. North is up: the artwork is north-aligned, like the bounds. -->
  <g transform="translate(930 90)" stroke="#8a7c62" fill="#8a7c62">
    <circle r="26" fill="none" stroke-width="2" />
    <path d="M0 -22 L7 4 L0 -2 L-7 4 Z" />
    <text y="-30" font-size="16" text-anchor="middle" font-family="Georgia, serif" stroke="none">Β</text>
  </g>
</svg>
